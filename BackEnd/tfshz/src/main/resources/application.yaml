server:
  port: 8081

spring:
  application:
    name: tfshz

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/tfshz?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          enabled: true
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s

  jackson:
    default-property-inclusion: non_null

  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,file:./imgs/

  # ================= Kafka：秒杀订单异步落库 =================
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:127.0.0.1:9092}
    producer:
      # acks=all：所有 ISR 副本落盘才确认，配合幂等生产避免重试重复
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: ${KAFKA_GROUP:seckill-order-group}
      # 新消费组从最早可读位置开始（重放历史消息便于排查）
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 50
    listener:
      # 与 KafkaConfig 里的容器工厂保持一致（RECORD = 每条处理后提交 offset）
      ack-mode: record
      # 给消费者的 Kafka 客户端绑定 Micrometer：暴露 kafka_consumer_fetch_manager_records_lag_max 等指标
      micrometer-enabled: true

mybatis-plus:
  type-aliases-package: com.tfsh.entity

logging:
  level:
    com.tfsh: debug
    # 秒杀消费链路单独抬高日志级别，便于观察重试/DLQ
    org.springframework.kafka: info
  pattern:
    dateformat: mm:ss.SSS

# ================= 可观测性 =================
management:
  endpoints:
    web:
      exposure:
        # 只放常用的几个；生产环境建议再加鉴权或走内网端口
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: tfshz

# ================= 秒杀 MQ 选择 =================
seckill:
  # kafka（默认）| stream
  mq: ${SECKILL_MQ:kafka}
  kafka:
    partitions: 3
    concurrency: 2
    group: ${KAFKA_GROUP:seckill-order-group}

# ================= JWT 配置 =================
tfsh:
  # 可选：额外图片目录（默认图片在 classpath:/static/imgs，已随代码入库）
  imgs:
    location: ${IMGS_LOCATION:}
  jwt:
    # 签名密钥：HS256 要求至少 32 字节。生产环境必须走环境变量，严禁把真实密钥提交进 git。
    # 生成随机密钥的命令：openssl rand -base64 48
    secret: ${JWT_SECRET:RFFjFMAArtLeIWvzItoC+VdA4y8oXDW7Hb0I5+KXuqEeNB4BY4ungvy9s0Ap5tRY}
    # access token 有效期：30 分钟（毫秒）
    access-ttl: 1800000
    # refresh token 有效期：7 天（毫秒）
    refresh-ttl: 604800000

