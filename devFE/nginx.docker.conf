server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 业务接口 → 后端容器
    location /api/ {
        proxy_pass http://backend:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # 图片：数据库里存的是 /imgs/... （后端把 /imgs/** 映射到磁盘 imgs 目录）
    location /imgs/ {
        proxy_pass http://backend:8081/imgs/;
        proxy_set_header Host $host;
    }

    # 分类图标：DB 存 /types/xxx.png，实际文件在 imgs/types/ 下
    location /types/ {
        proxy_pass http://backend:8081/imgs/types/;
        proxy_set_header Host $host;
    }

    # SPA 路由回退（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
